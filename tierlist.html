<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sythe Tiers - Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0102;
    --panel:#120404;
    --panel-2:#0d0303;
    --row:#140505;
    --row-hover:#1e0808;
    --border:#3a1418;
    --border-soft:#280d0f;
    --text-hi:#f7ecec;
    --text-mid:#b98a8a;
    --text-dim:#7a4f4f;
    --accent-green:#5cd685;
    --accent-orange:#ff9d3d;
    --accent-orange2:#ffb75c;

    --gold:#f2c94c; --gold-dim:#a68a2e;
    --blue:#6fb8f2; --blue-dim:#8a7a7a;
    --orange:#f0923c; --orange-dim:#b9752f;
    --violet:#e08cc9; --violet-dim:#ad6795;
    --gray:#e2d7d7; --gray-dim:#947070;

    --na-bg:#3a1e22; --na-fg:#e8707c;
    --eu-bg:#123227; --eu-fg:#4fcf9d;
    --me-bg:#132a3a; --me-fg:#5cb8e8;
    --as-bg:#3a3013; --as-fg:#e8c05c;
    --oce-bg:#331a3a; --oce-fg:#c983e8;
    --sa-bg:#123a35; --sa-fg:#4fe8c9;
    --af-bg:#3a2913; --af-fg:#e8a05c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    background:
      radial-gradient(ellipse 1000px 600px at 12% -8%, rgba(227,19,31,.38), transparent 60%),
      radial-gradient(ellipse 800px 550px at 105% 15%, rgba(255,70,50,.22), transparent 55%),
      radial-gradient(ellipse 900px 700px at 50% 120%, rgba(180,10,20,.25), transparent 60%),
      linear-gradient(180deg, #0d0203 0%, #150405 45%, #0a0102 100%);
    color:var(--text-hi);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
    background:repeating-linear-gradient(120deg, transparent 0 120px, rgba(255,40,40,.03) 120px 122px, transparent 122px 240px);
  }
  header.nav, .tabs-wrap, .table-wrap, .overlay{ position:relative; z-index:1; }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  /* ---------------- HEADER ---------------- */
  header.nav{
    background:var(--panel);
    border-bottom:1px solid var(--border-soft);
    padding:16px 28px;
    display:flex; align-items:center; gap:34px;
    flex-wrap:wrap;
  }
  .logo{
    font-family:'Press Start 2P',monospace;
    font-size:1.05rem;
    letter-spacing:-.01em;
    display:flex;
    white-space:nowrap;
    line-height:1;
  }
  .logo .a{
    background:linear-gradient(180deg,#8ee06a 0%,#5fb845 38%,#8a5a2e 42%,#5c3a1c 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    text-shadow:3px 3px 0 #241207, 3px 3px 0 #241207;
    filter:drop-shadow(2px 3px 0 #1a0d05);
    margin-right:8px;
  }
  .logo .b{
    background:linear-gradient(180deg,#ffe08a 0%,#ffb84d 45%,#e8730f 55%,#b8560c 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(2px 3px 0 #4a1e05);
  }
  nav.links{
    display:flex; align-items:center; gap:26px;
    flex:1 1 auto;
    color:var(--text-mid);
    font-weight:500;
    font-size:.92rem;
  }
  nav.links .item{
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    transition:color .15s;
    white-space:nowrap;
  }
  nav.links .item:hover{color:var(--text-hi);}
  nav.links .item.active{color:var(--text-hi); font-weight:700;}
  nav.links svg{width:18px; height:18px; opacity:.85;}
  nav.links img{width:18px; height:18px; opacity:.85;}
  .chev{width:12px !important; height:12px !important; opacity:.6;}

  .nav-search{
    margin-left:auto;
    display:flex; align-items:center; gap:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 12px;
    min-width:220px;
    color:var(--text-dim);
  }
  .nav-search svg{width:15px; height:15px; flex:0 0 auto;}
  .nav-search input{
    background:transparent; border:none; outline:none;
    color:var(--text-hi); font-size:.87rem; width:100%;
    font-family:inherit;
  }
  .nav-search input::placeholder{color:var(--text-dim);}
  .kbd{
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:5px; font-size:.72rem; padding:1px 6px;
    color:var(--text-dim); flex:0 0 auto;
  }

  /* ---------------- TABS ---------------- */
  .tabs-wrap{
    padding:22px 28px 0;
    max-width:1240px;
    margin:0 auto;
  }
  .tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:thin;
  }
  .tabs::-webkit-scrollbar{height:5px;}
  .tabs::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .tab-btn{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:14px 20px;
    cursor:pointer;
    color:var(--text-mid);
    font-weight:700;
    font-size:.82rem;
    transition:background .15s, border-color .15s, transform .15s, color .15s;
    position:relative;
  }
  .tab-btn:hover{transform:translateY(-2px); color:var(--text-hi);}
  .tab-btn img, .tab-btn svg{width:24px; height:24px; object-fit:contain; opacity:.75; transition:opacity .15s;}
  .tab-btn.active{
    background:#151d27;
    border-color:#2a3644;
    color:#fff;
  }
  .tab-btn.active img, .tab-btn.active svg{opacity:1;}
  .tab-btn.active::after{
    content:"";
    position:absolute; bottom:-5px; left:16%; right:16%;
    height:3px; border-radius:3px;
    background:linear-gradient(90deg,#ffb75c,#ff7a3d);
  }

  .info-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:18px 0 6px;
    flex-wrap:wrap; gap:12px;
  }
  .info-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--panel);
    border:1px solid var(--border-soft);
    color:var(--text-mid);
    padding:9px 16px;
    border-radius:10px;
    font-weight:600; font-size:.84rem;
    cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .info-btn:hover{color:var(--text-hi); border-color:var(--border);}
  .info-btn svg{width:16px; height:16px;}

  .club-box{
    display:flex; align-items:center; gap:10px;
  }
  .club-badge{
    display:flex; align-items:center; gap:8px;
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:8px 14px;
  }
  .club-badge .cb-logo{
    font-weight:800; font-size:.78rem;
    background:linear-gradient(90deg,#ff7a7a,#ff4d4d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1;
  }
  .club-badge .cb-text{display:flex; flex-direction:column; line-height:1.25;}
  .club-badge .cb-label{font-size:.62rem; color:var(--text-dim); font-weight:700; letter-spacing:.04em;}
  .club-badge .cb-ip{font-size:.82rem; font-weight:700; color:var(--text-hi); display:flex; align-items:center; gap:6px; cursor:pointer;}
  .club-badge .cb-ip svg{width:13px; height:13px; opacity:.6;}
  .discord-btn{
    width:38px; height:38px; border-radius:10px;
    background:var(--panel); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .discord-btn img{width:18px; height:18px;}

  /* ---------------- TABLE ---------------- */
  .table-wrap{max-width:1240px; margin:0 auto; padding:14px 28px 80px;}
  .col-headers{
    display:flex; align-items:center; gap:14px;
    padding:6px 18px 12px;
    color:var(--text-dim);
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .col-headers .c-rank{width:44px;}
  .col-headers .c-player{width:280px;}
  .col-headers .c-region{width:60px; text-align:center; margin-left:auto;}
  .col-headers .c-tiers{flex:1; text-align:right; padding-right:4px;}

  #list{display:flex; flex-direction:column; gap:10px;}

  .p-row{
    background:var(--row);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    position:relative;
    animation:rise .42s cubic-bezier(.2,.7,.3,1) both;
    transition:background .15s, border-color .15s, transform .15s;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .p-row:hover{ background:var(--row-hover); border-color:var(--border); transform:translateY(-2px); }
  .p-row:active{ transform:translateY(0) scale(.995); }

  .rank-wrap{
    position:relative;
    width:132px; height:56px;
    flex:0 0 auto;
  }
  .ribbon-clip{
    position:absolute; inset:0;
    overflow:hidden;
    border-radius:9px 4px 4px 9px;
    clip-path:polygon(0 0, 100% 0, 80% 100%, 0 100%);
  }
  .shimmer-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .rank-num{
    position:absolute; left:11px; bottom:3px; z-index:2;
    font-family:'Rubik',sans-serif; font-weight:800; font-style:italic;
    font-size:1.55rem; color:#fff;
    text-shadow:0 2px 3px rgba(0,0,0,.6);
  }
  .ribbon-skin{
    position:absolute; right:8px; bottom:-3px; z-index:3;
    width:44px; image-rendering:pixelated;
    filter:drop-shadow(-3px -2px 2px rgba(0,0,0,.55));
  }

  .p-info{width:230px; min-width:0;}
  .p-name-row{display:flex; align-items:center; gap:6px;}
  .p-name{font-weight:700; font-size:1.05rem; color:var(--text-hi);}
  .name-gold-shine{
    background:linear-gradient(90deg, #fff9e0 0%, #ffd479 20%, #fff9e0 40%, #ffb92e 60%, #fff9e0 80%, #ffd479 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    animation:goldShine 3.2s linear infinite;
    text-shadow:0 0 14px rgba(255,201,90,.35);
  }
  @keyframes goldShine{
    0%{ background-position:0% center; }
    100%{ background-position:200% center; }
  }
  @media (prefers-reduced-motion: reduce){
    .name-gold-shine{ animation:none; }
  }
  mark{background:none; color:#ffd479; text-decoration:underline; text-decoration-color:rgba(255,212,121,.5); text-underline-offset:2px;}
  .mini-badge{width:15px; height:15px; flex:0 0 auto;}
  .p-title-row{display:flex; align-items:center; gap:5px; margin-top:2px; color:var(--text-dim); font-size:.76rem;}
  .p-title-row img{width:13px; height:13px; object-fit:contain;}
  .p-title-row .pts{color:var(--text-dim); opacity:.75;}

  .region-pill{
    flex:0 0 auto; margin-left:auto;
    width:46px; height:36px;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.78rem;
  }

  .p-tiers{ display:flex; gap:7px; flex-wrap:nowrap; }
  .tier-chip{
    width:36px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .tier-icon{
    width:30px; height:30px; border-radius:50%;
    background:#0a0e14;
    border:2px solid transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .tier-icon img{width:16px; height:16px; object-fit:contain;}
  .tier-label{font-size:.68rem; font-weight:800;}

  .kind-badge{
    display:flex; align-items:center; gap:8px;
    margin-left:auto;
  }
  .kind-badge .tier-icon{width:34px; height:34px;}
  .kind-badge .tier-icon img{width:18px; height:18px;}
  .kind-badge .tier-label{font-size:.85rem;}

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--text-dim);
    display:none;
  }
  .empty-state.show{display:block;}
  .empty-state img{width:40px; opacity:.4; margin-bottom:12px;}

  /* ---------------- MODAL ---------------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(4,6,9,.7);
    backdrop-filter:blur(5px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; opacity:0; pointer-events:none;
    transition:opacity .22s ease;
    padding:20px;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    width:100%; max-width:420px;
    background:linear-gradient(180deg,#141b24,var(--bg) 65%);
    border:1px solid var(--border);
    border-radius:20px;
    padding:26px 24px 28px;
    position:relative; text-align:center;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
    transform:translateY(24px) scale(.95); opacity:0;
    transition:transform .32s cubic-bezier(.2,.8,.25,1.1), opacity .25s ease;
  }
  .overlay.show .modal{transform:translateY(0) scale(1); opacity:1;}
  .modal-close{
    position:absolute; top:14px; right:14px;
    width:32px; height:32px; border-radius:50%;
    background:var(--panel-2); border:1px solid var(--border);
    color:var(--text-mid);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .15s, color .15s, transform .15s;
  }
  .modal-close:hover{background:#d94848; color:#fff; transform:rotate(90deg);}
  .modal-bust-ring{
    width:104px; height:104px; border-radius:50%;
    margin:4px auto 14px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-2);
  }
  .modal-bust-ring img{width:80px; image-rendering:pixelated;}
  .modal-name{
    font-family:'Rubik',sans-serif; font-weight:800; font-size:1.5rem;
    color:#ffd479;
    margin:0 0 12px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .modal-name .mini-badge{width:20px; height:20px;}
  .title-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--panel-2); border:1px solid var(--border);
    padding:8px 16px; border-radius:999px;
    font-weight:700; font-size:.85rem; color:var(--gold);
    margin-bottom:14px;
  }
  .title-badge img{width:20px; height:20px;}
  .modal-region{color:var(--text-dim); font-size:.85rem; margin-bottom:16px;}
  .modal-desc{
    color:var(--text-mid); font-size:.85rem; line-height:1.6; text-align:left;
    background:var(--panel-2); border:1px solid var(--border-soft);
    border-radius:12px; padding:12px 14px; margin-bottom:18px;
  }
  .section-label{
    text-align:left; text-transform:uppercase; letter-spacing:.1em;
    font-size:.7rem; color:var(--text-dim); font-weight:800; margin:0 0 8px;
  }
  .position-ribbon{
    display:flex; align-items:center; gap:10px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:12px; padding:10px 14px; margin-bottom:18px;
  }
  .position-ribbon .num{
    font-family:'Rubik',sans-serif; font-style:italic; font-weight:900; font-size:1.3rem;
    background:linear-gradient(155deg,#fff7dd,var(--gold));
    color:#2b1500; border-radius:8px; padding:4px 12px;
  }
  .position-ribbon .label{font-weight:800; font-size:.85rem; color:var(--text-hi); display:flex; align-items:center; gap:6px;}
  .position-ribbon .pts{color:var(--text-dim); font-weight:600; font-size:.78rem;}
  .modal-tiers{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .modal-tier{
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:11px; padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .modal-tier img{width:22px; height:22px; object-fit:contain;}
  .modal-tier .tlabel{font-size:.68rem; font-weight:800; padding:2px 7px; border-radius:6px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid var(--border);
    color:var(--text-hi); padding:10px 18px; border-radius:10px;
    font-size:.85rem; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::selection{background:#ff7a3d; color:#fff;}

  @media (max-width:760px){
    nav.links .item span{display:none;}
    .nav-search{min-width:0; flex:0 0 auto;}
    .nav-search input{display:none;}
    .col-headers{display:none;}
    .p-tiers{display:none;}
    .kind-badge{margin-left:0;}
    .p-info{width:auto; flex:1;}
    header.nav{gap:14px; padding:14px 16px;}
    .tabs-wrap{padding:16px 14px 0;}
    .table-wrap{padding:14px 14px 60px;}
    .info-row{padding:0 2px;}
    .rank-wrap{width:112px; height:52px;}
    .rank-num{font-size:1.35rem; left:10px; bottom:3px;}
    .ribbon-skin{width:40px; right:6px;}
    .logo{font-size:.85rem;}
  }
  @media (max-width:380px){
    .rank-wrap{width:100px; height:48px;}
    .rank-num{font-size:1.15rem;}
    .ribbon-skin{width:36px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }
</style>
</head>
<body>

<header class="nav">
  <a href="index.html" style="text-decoration:none;"><div class="logo"><span class="a">SCYTHE</span><span class="b">TIERS</span></div></a>
  <nav class="links">
    <a class="item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg><span>Home</span></a>
    <div class="item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 01-10 0V4zM7 6H4a3 3 0 003 3M17 6h3a3 3 0 01-3 3"/></svg><span>Rankings</span></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="10" rx="4"/><circle cx="8.5" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="13" r="1.2" fill="currentColor" stroke="none"/><path d="M8 8l1.5-3h5L16 8"/></svg><span>Discords</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2H4v20h16V9l-7-7z"/><path d="M9 2v7h7"/></svg><span>API Docs</span></div>
  </nav>
  <div class="nav-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search player...">
    <span class="kbd">/</span>
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs" id="tabsRow"></div>
  <div class="info-row">
    <button class="info-btn" id="infoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Information
    </button>
    <div class="club-box">
      <div class="club-badge">
        <span class="cb-logo">SYTHE<br>CLUB</span>
        <div class="cb-text">
          <span class="cb-label">SERVER IP</span>
          <span class="cb-ip" id="ipCopy">play.sythetiers.gg
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </span>
        </div>
      </div>
      <div class="discord-btn" id="discordBtn"><img id="discordIcon" src="" alt="discord"></div>
    </div>
  </div>
</div>

<div class="table-wrap">
  <div class="col-headers">
    <span class="c-rank">#</span>
    <span class="c-player">PLAYER</span>
    <span class="c-tiers" id="tiersColLabel">TIERS</span>
    <span class="c-region">REGION</span>
  </div>
  <div id="list"></div>
  <div class="empty-state" id="emptyState">
    <div>No fighters match your search.</div>
  </div>
</div>

<div class="overlay" id="overlay">

  function loadAdminPlayers(){

  function mergeAdminPlayers(basePlayers){
    var adminPlayers = loadAdminPlayers();
    var regionFullMap = {NA:'North America',EU:'Europe',ME:'Middle East',AS:'Asia',OCE:'Oceania',SA:'South America',AF:'Africa'};
    var kitKinds = ['vanilla','smp','sword','nethop','mace','pot','uhc','axe'];
    var merged = basePlayers.slice();
    adminPlayers.forEach(function(ap){
      var uuid = 'admin-' + ap.id;
      BUNDLE.skins[uuid] = STEVE_SKIN_URI;
      merged.push({
        rank: '0',
        name: ap.name,
        skin_url: '',
        uuid: uuid,
        title: ap.title,
        points: ap.points + ' points',
        points_num: ap.points,
        region: ap.region,
        region_full: regionFullMap[ap.region] || ap.region,
        tiers: kitKinds.map(function(k){ return { kind:k, icon:'', tier:ap.tier }; }),
        description: ap.name + ' — added via the admin panel, holding a ' + ap.tier + ' tier.'
      });
    });
    // recompute ranks by points, preserving ties like the original list
    merged.sort(function(a,b){ return b.points_num - a.points_num; });
    var rank = 0, prevPoints = null;
    merged.forEach(function(p, i){
      if(p.points_num !== prevPoints){ rank = i+1; prevPoints = p.points_num; }
      p.rank_num = rank;
    });
    return merged;
  }

    var map = {

      HT2:['--blue','--blue'], LT2:['--blue-dim','--blue-dim'],

  /* ---------------- tiny cute click sound (Web Audio) ---------------- */
  var audioCtx = null;
  function ctx(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    return audioCtx;
  }
  function playPop(freqStart, freqEnd, dur, type, vol){
    var ac = ctx(); if(!ac) return;
    if(ac.state === 'suspended'){ ac.resume(); }
    var t0 = ac.currentTime;
    var osc = ac.createOscillator(); var gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freqStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function soundOpen(){ playPop(520, 900, 0.16, 'triangle', 0.14); }
  function soundClose(){ playPop(700, 340, 0.12, 'triangle', 0.1); }
  function soundTick(){ playPop(1000, 1200, 0.05, 'sine', 0.05); }
  function soundCopy(){ playPop(700, 1400, 0.14, 'sine', 0.1); }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function highlight(name, query){
    if(!query) return escapeHtml(name);
    var idx = name.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return escapeHtml(name);
    var before = escapeHtml(name.slice(0, idx));
    var match = escapeHtml(name.slice(idx, idx + query.length));
    var after = escapeHtml(name.slice(idx + query.length));
    return before + '<mark>' + match + '</mark>' + after;
  }
  function rankClass(n){
    if(n === 1) return 'rank-1';

  function tierChip(t){
    var vars = tierVars(t.tier);
    return '<div class="tier-chip" title="'+escapeHtml(t.kind)+' '+escapeHtml(t.tier)+'">' +
      '<span class="tier-icon" style="border-color:var('+vars[0]+');"><img src="'+(tierIcons[t.kind]||'')+'" alt="'+escapeHtml(t.kind)+'"></span>' +
      '<span class="tier-label" style="color:var('+vars[1]+');">'+escapeHtml(t.tier)+'</span>' +
    '</div>';
  }

  function tiersRowHtml(p){
    // ring rule: ring shown while tier != HT1, stops permanently once an HT1 is seen
    var htSeen = false;
    return p.tiers.map(function(t){
      var ring = false;
      if(!htSeen){
        if(t.tier === 'HT1'){ htSeen = true; ring = false; }
        else{ ring = true; }
      }
      var vars = tierVars(t.tier);
      var borderStyle = ring ? 'border-color:var('+vars[0]+');' : 'border-color:#0a0e14;';
      return '<div class="tier-chip" title="'+escapeHtml(t.kind)+' '+escapeHtml(t.tier)+'">' +
        '<span class="tier-icon" style="'+borderStyle+'"><img src="'+(tierIcons[t.kind]||'')+'" alt="'+escapeHtml(t.kind)+'"></span>' +
        '<span class="tier-label" style="color:var('+vars[1]+');">'+escapeHtml(t.tier)+'</span>' +
      '</div>';
    }).join('');
  }

  function kindBadgeHtml(p, kind){
    var t = p.tiers.find(function(x){ return x.kind === kind; });
    if(!t) return '<span style="color:var(--text-dim); font-size:.78rem;">No data</span>';
    var vars = tierVars(t.tier);
    return '<div class="kind-badge">' +
      '<span class="tier-icon" style="border-color:var('+vars[0]+');"><img src="'+(tierIcons[kind]||'')+'" alt="'+escapeHtml(kind)+'"></span>' +
      '<span class="tier-label" style="color:var('+vars[1]+');">'+escapeHtml(t.tier)+'</span>' +
    '</div>';
  }

  function rankTierClass(n){

  function renderRow(p, query, displayRank, tabDef){
    var badge = badgeForRank(displayRank);
    var badgeHtml = badge ? '<img class="mini-badge" src="'+badge+'" alt="badge">' : '';
    var skinUri = skins[p.uuid] || '';
    var titleIcon = titleIcons[p.title] || '';
    var regionKey = regionColors[p.region] || 'na';
    var shimmer = BUNDLE.placements[rankTierClass(displayRank)];

    var tiersHtml = tabDef.kind ? kindBadgeHtml(p, tabDef.kind) :
      '<div class="p-tiers">'+tiersRowHtml(p)+'</div>';

    var row = document.createElement('div');
    row.className = 'p-row';
    row.setAttribute('data-name', p.name.toLowerCase());
    row.setAttribute('tabindex', '0');
    row.setAttribute('role', 'button');
    row.innerHTML =
      '<div class="rank-wrap">' +
        '<div class="ribbon-clip"><img class="shimmer-bg" src="'+shimmer+'" alt=""></div>' +
        '<span class="rank-num">'+displayRank+'.</span>' +
        '<img class="ribbon-skin" src="'+skinUri+'" alt="'+escapeHtml(p.name)+' skin">' +
      '</div>' +
      '<div class="p-info">' +
        '<div class="p-name-row"><span class="p-name'+(displayRank===1?' name-gold-shine':'')+'">'+highlight(p.name, query)+'</span>'+badgeHtml+'</div>' +
        '<div class="p-title-row"><img src="'+titleIcon+'" alt=""><span>'+escapeHtml(p.title)+'</span><span class="pts">('+escapeHtml(p.points)+')</span></div>' +
      '</div>' +
      tiersHtml +
      '<div class="region-pill" style="background:var(--'+regionKey+'-bg);color:var(--'+regionKey+'-fg);">'+p.region+'</div>';

    row.addEventListener('click', function(){ openModal(p); });
    row.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(p); } });
    return row;
  }

  function renderList(){
    var q = searchInput.value.trim();
    var tabDef = TABS.filter(function(t){ return t.id === currentTab; })[0];
    var list = document.getElementById('list');
    list.innerHTML = '';

    if(tabDef.noData){
      document.getElementById('emptyState').innerHTML = '<div>No ranked data available for '+tabDef.label+' yet — check back soon.</div>';
      document.getElementById('emptyState').classList.add('show');
      return;
    }

    var pool = players.slice();
    if(tabDef.kind){
      pool = pool.filter(function(p){ return p.tiers.some(function(t){ return t.kind === tabDef.kind; }); });
      pool.sort(function(a,b){
        var ta = a.tiers.find(function(t){ return t.kind === tabDef.kind; });
        var tb = b.tiers.find(function(t){ return t.kind === tabDef.kind; });
        return tierRank(ta.tier) - tierRank(tb.tier);
      });
    }

    var filtered = pool.filter(function(p){
      return !q || p.name.toLowerCase().indexOf(q.toLowerCase()) !== -1;
    });

    document.getElementById('emptyState').classList.toggle('show', filtered.length === 0);
    if(filtered.length === 0){
      document.getElementById('emptyState').innerHTML = '<div>No fighters match your search.</div>';
    }

    filtered.forEach(function(p, i){
      var displayRank = tabDef.kind ? (i+1) : p.rank_num;
      var row = renderRow(p, q, displayRank, tabDef);
      row.style.animationDelay = (i * 0.03) + 's';
      list.appendChild(row);
    });
  }

  function openModal(p){
    soundOpen();
    document.getElementById('modalSkin').src = skins[p.uuid] || '';
    document.getElementById('modalBustRing').style.boxShadow = '0 0 0 3px '+ringColor(p.rank_num)+', 0 0 24px -4px '+ringColor(p.rank_num);
    var badge = badgeForRank(p.rank_num);
    document.getElementById('modalName').innerHTML = '<span'+(p.rank_num===1?' class="name-gold-shine"':'')+'>'+escapeHtml(p.name)+'</span>' + (badge ? ' <img class="mini-badge" src="'+badge+'" alt="badge">' : '');
    document.getElementById('modalTitleBadge').innerHTML = '<img src="'+(titleIcons[p.title]||'')+'" alt="">'+escapeHtml(p.title);
    document.getElementById('modalRegion').textContent = p.region_full || p.region;
    document.getElementById('modalDesc').textContent = p.description;
    document.getElementById('modalPosition').innerHTML =
      '<span class="num">'+p.rank_num+'.</span>' +
      '<span class="label">🏆 OVERALL <span class="pts">('+escapeHtml(p.points)+')</span></span>';
    document.getElementById('modalTiers').innerHTML = p.tiers.map(function(t){
      var vars = tierVars(t.tier);
      return '<div class="modal-tier">' +
        '<img src="'+(tierIcons[t.kind]||'')+'" alt="'+escapeHtml(t.kind)+'">' +
        '<span class="tlabel" style="background:var('+vars[0]+');color:#1a1200;">'+escapeHtml(t.tier)+'</span>' +
      '</div>';
    }).join('');
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    soundClose();
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });
  modalCard.addEventListener('click', function(e){ e.stopPropagation(); });

  /* ---------------- search ---------------- */
  var searchInput = document.getElementById('searchInput');
  var searchDebounce;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(renderList, 80);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== searchInput){
      e.preventDefault();
      searchInput.focus();
    }
  });

  document.addEventListener('pointerdown', function unlock(){
    ctx();
    document.removeEventListener('pointerdown', unlock);
  }, {once:true});

  /* ---------------- copy IP ---------------- */
  var toast = document.getElementById('toast');
  var toastTimer;
  document.getElementById('ipCopy').addEventListener('click', function(){
    var text = 'play.eventmc.fun';
    soundCopy();
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  });

  document.getElementById('infoBtn').addEventListener('click', function(){
    soundTick();
    toast.textContent = 'Sythe Tiers ranks PvP combat skill across every kit — click a player to see their full breakdown.';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); toast.textContent = 'Copied to clipboard'; }, 3200);
  });

  renderList();
})();
</script>
</body>
</html>
